# Her push ve PR'da derleme kontrolü (Windows masaüstü projesi Linux'ta da derlenebilir)
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core + UI + Windows masaüstü derle
        run: dotnet build src/Kuyumcu.Desktop/Kuyumcu.Desktop.csproj -c Release
      - name: Birim testleri
        run: dotnet test tests/Kuyumcu.Core.Tests/Kuyumcu.Core.Tests.csproj -c Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
      - name: MAUI Android iş yükünü kur
        run: dotnet workload install maui-android
      - name: Android SDK bağımlılıklarını tamamla (API 36)
        run: >
          dotnet build src/Kuyumcu.Android/Kuyumcu.Android.csproj -t:InstallAndroidDependencies
          -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True
      - name: Android uygulamasını derle (imzasız)
        run: dotnet build src/Kuyumcu.Android/Kuyumcu.Android.csproj -f net10.0-android -c Release -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
