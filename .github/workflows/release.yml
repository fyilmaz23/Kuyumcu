# Sürüm yayını: "v2.1.0" gibi bir etiket gönderildiğinde
#  - Windows: Microsoft Store'a yüklenecek MSIX paketi
#  - Android: Google Play'e yüklenecek imzalı AAB paketi
# üretilir ve GitHub Release'e eklenir. Store/Play'e yükleme Partner Center / Play Console'dan yapılır.
#
# Gerekli ayarlar (GitHub > Settings > Secrets and variables > Actions): bkz. docs/YAYIN.md
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (örn: 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Sürüm X.Y.Z biçiminde olmalı: $ver"; exit 1
          fi
          echo "semver=$ver" >> "$GITHUB_OUTPUT"

  windows-store:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Gizli yapılandırma dosyalarını üret
        shell: pwsh
        env:
          LICENSE_SECRET_KEY: ${{ secrets.LICENSE_SECRET_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: ./build/write-secrets.ps1

      - name: Yayın çıktısını oluştur
        run: >
          dotnet publish src/Kuyumcu.Desktop/Kuyumcu.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ needs.version.outputs.semver }}
          -p:DebugType=none
          -o artifacts/desktop-publish

      - name: MSIX paketi oluştur
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: >
          ./build/pack-msix.ps1
          -PublishDir artifacts/desktop-publish
          -PackagingDir src/Kuyumcu.Desktop/Packaging
          -Version "${{ needs.version.outputs.semver }}.0"
          -OutputPath "artifacts/KuyumcuDefteri_${{ needs.version.outputs.semver }}_x64.msix"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: artifacts/*.msix

  android-play:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: MAUI Android iş yükünü kur
        run: dotnet workload install maui-android

      - name: Android SDK bağımlılıklarını tamamla (API 36)
        run: >
          dotnet build src/Kuyumcu.Mobile/Kuyumcu.Mobile.csproj -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=True

      - name: Gizli yapılandırma dosyalarını üret
        shell: pwsh
        env:
          LICENSE_SECRET_KEY: ${{ secrets.LICENSE_SECRET_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: ./build/write-secrets.ps1

      - name: Yükleme anahtarını (upload keystore) çöz
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 tanımlı değil. Bkz. docs/YAYIN.md"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: İmzalı AAB oluştur
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/Kuyumcu.Mobile/Kuyumcu.Mobile.csproj
          -c Release -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.semver }}
          -p:ApplicationVersion=$(( 100 + ${{ github.run_number }} ))
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass="env:ANDROID_KEY_PASSWORD"
          -p:AndroidSigningStorePass="env:ANDROID_KEYSTORE_PASSWORD"
          -o artifacts/android

      - name: Anahtarı temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: artifacts/android/*-Signed.aab

  github-release:
    needs: [version, windows-store, android-play]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: "Kuyumcu Defteri v${{ needs.version.outputs.semver }}"
          body: |
            ## Kuyumcu Defteri v${{ needs.version.outputs.semver }}

            - **Windows:** `.msix` dosyasını Partner Center'da yeni gönderime yükleyin.
            - **Android:** `.aab` dosyasını Play Console'da yeni sürüme yükleyin.
          files: dist/*
