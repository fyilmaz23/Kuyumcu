<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android açılış ekranı simgesi (zemin rengi proje dosyasında). branding/app-icon-foreground.svg ile aynı;
       defter, simge ön planıyla aynı oranda küçültülüp ortalandı.
       Çizim branding/app-icon.svg ile aynıdır; birini değiştirirsen ötekini de güncelle. -->
  <defs>
    <linearGradient id="kdBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C94F"/>
      <stop offset="1" stop-color="#B97A1D"/>
    </linearGradient>
    <linearGradient id="kdCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDB943"/>
      <stop offset="1" stop-color="#B7781C"/>
    </linearGradient>
    <linearGradient id="kdPages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEDB0"/>
      <stop offset="1" stop-color="#F5CC6A"/>
    </linearGradient>
    <linearGradient id="kdGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEE96"/>
      <stop offset="1" stop-color="#F2BE40"/>
    </linearGradient>
    <clipPath id="kdBookClip"><rect x="96" y="78" width="322" height="344" rx="36"/></clipPath>
  </defs>
  <g transform="translate(256 256) scale(0.64) translate(-257 -250)">
  <g id="kdBook" clip-path="url(#kdBookClip)">
    <!-- arka kapak ve sırt -->
    <rect x="96" y="78" width="322" height="344" rx="36" fill="url(#kdBody)"/>
    <!-- sayfalar -->
    <path d="M132 358 H398 a8 8 0 0 1 8 8 V396 a8 8 0 0 1 -8 8 H132 a23 23 0 0 1 0 -46 Z"
          fill="url(#kdPages)" stroke="#4A2C0C" stroke-width="9" stroke-linejoin="round"/>
    <line x1="134" y1="381" x2="394" y2="381" stroke="#E6B455" stroke-width="3"/>
    <!-- ön kapak -->
    <path d="M148 78 H384 a34 34 0 0 1 34 34 V334 a24 24 0 0 1 -24 24 H148 Z" fill="url(#kdCover)"/>
    <path d="M148 78 V358 H394 a24 24 0 0 0 24 -24" fill="none" stroke="#4A2C0C" stroke-width="10" stroke-linejoin="round"/>
    <!-- pırlanta -->
    <g stroke="#4A2C0C" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="211,146 355,146 396,201 283,327 170,201" fill="url(#kdGem)" stroke-width="10"/>
      <g fill="none" stroke-width="8">
        <polyline points="170,201 396,201"/>
        <polyline points="261,146 235,201 283,327 331,201 305,146"/>
      </g>
    </g>
  </g>
  </g>
</svg>
